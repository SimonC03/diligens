[project]
name = "diligens"
version = "0.1.0"
description = "SIE4 bookkeeping to Financial Due Diligence pack, plus Buy & Build screening on Swedish registry data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "mcp>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.scripts]
diligens = "diligens.cli:app"
diligens-mcp = "diligens.mcp_server:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diligens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Swedish characters in strings and comments

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pathlib.Path", "typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls external APIs or the LLM; run with -m live"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
